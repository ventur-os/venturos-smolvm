name: Release Website smolvm

on:
  push:
    tags:
      - 'v1.25.0-venturos.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned upstream source
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev pkg-config e2fsprogs patchelf git-lfs
          rustup toolchain install 1.98.1 --profile minimal
          rustup component add --toolchain 1.98.1 rustfmt
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --branch v1.25.0 https://github.com/smol-machines/smolvm.git upstream
          cd upstream
          test "$(git rev-parse HEAD)" = 18a7c09fe334ab64fda0e672f3c98aebbfff64e6
          git lfs pull
          git apply --check ../patches/override-stat.patch
          git apply ../patches/override-stat.patch
          ./scripts/check-libkrun-provenance.sh
          objdump -T lib/linux-x86_64/libkrun.so | grep -q krun_add_virtiofs4
          cargo +1.98.1 fmt --check
          export LIBKRUN_BUNDLE="$PWD/lib/linux-x86_64"
          cargo +1.98.1 test --locked --lib override_stat_is_explicit_and_survives_record_roundtrip
          cargo +1.98.1 test --locked --lib test_type_conversions
          cargo +1.98.1 check --locked --all-targets
          cargo +1.98.1 build --locked --release --bin smolvm
      - name: Package with pinned upstream runtime assets
        run: |
          set -euo pipefail
          archive=smolvm-1.25.0-linux-x86_64.tar.gz
          curl -fsSL --retry 5 --retry-delay 5 -o "$archive" "https://github.com/smol-machines/smolvm/releases/download/v1.25.0/$archive"
          echo "e4c6d1962243b94d788aaea161b0f54ec2f4699d234b5865547ef334ab4078ca  $archive" | sha256sum -c -
          mkdir bundle
          tar -xzf "$archive" -C bundle
          cd bundle/smolvm-1.25.0-linux-x86_64
          sha256sum -c checksums.txt
          cp ../../upstream/target/release/smolvm smolvm-bin
          find . -type f ! -name checksums.txt -print0 | sort -z | xargs -0 sha256sum > checksums.txt
          sha256sum -c checksums.txt
          cd ../..
          tar -C bundle -czf smolvm-1.25.0-venturos-linux-x86_64.tar.gz smolvm-1.25.0-linux-x86_64
          sha256sum smolvm-1.25.0-venturos-linux-x86_64.tar.gz > smolvm-1.25.0-venturos-linux-x86_64.tar.gz.sha256
      - name: Verify packaged Website mount and restart persistence
        run: |
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
          python3 scripts/website-mount-smoke.py bundle/smolvm-1.25.0-linux-x86_64/smolvm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smolvm-linux-x86_64
          path: smolvm-1.25.0-venturos-linux-x86_64.tar.gz*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: smolvm-linux-x86_64
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" smolvm-1.25.0-venturos-linux-x86_64.tar.gz smolvm-1.25.0-venturos-linux-x86_64.tar.gz.sha256 --verify-tag --title "$GITHUB_REF_NAME" --notes "Pinned smolvm v1.25.0 with Website-only override-stat volume support."
